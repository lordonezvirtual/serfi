# ===========================================================================
# PostgREST Configuration File
# Exposing serfinanza_db as a RESTful API
# ===========================================================================

# The standard connection URI for PostgreSQL
db-uri = "postgres://postgres:postgres@localhost:5432/serfinanza_db"

# The database schema to expose (api has clientes, cuentas, tarjetas, transacciones, ofertas, tareas_hitl)
db-schema = "api"

# The database role to use when no client authentication is provided
db-anon-role = "web_anon"

# The port to run the PostgREST server on
server-port = 3000

# Server host (optional, defaults to * which binds to all interfaces)
server-host = "127.0.0.1"

# Database connection pool settings (optional, defaults are fine)
db-pool = 10
db-pool-timeout = 10
